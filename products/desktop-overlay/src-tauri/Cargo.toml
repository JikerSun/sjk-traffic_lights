[package]
name = "ai-traffic-lights-desktop"
version = "0.1.1"
description = "AI Traffic Lights desktop overlay for Cursor"
authors = ["JikerSun"]
edition = "2021"

[lib]
name = "ai_traffic_lights_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6.1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
sysinfo = "0.33"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
