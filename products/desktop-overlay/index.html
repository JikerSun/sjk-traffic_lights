<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Traffic Lights Overlay</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111317;
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        color: #d8dee9;
      }
      .shell {
        display: flex;
        gap: 10.8px;
        align-items: flex-start;
      }
      .overlay {
        position: relative;
        width: 60.48px;
        height: 161.46px;
        user-select: none;
        cursor: move;
      }
      .panel-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .light {
        position: absolute;
        width: 48.6px;
        height: 48.6px;
        left: 5.94px;
      }
      #red { top: 10.26px; }
      #yellow { top: 56.43px; }
      #green { top: 102.6px; }
      .info {
        min-width: 280px;
        font-size: 13px;
        line-height: 1.6;
      }
      .state {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .hint {
        margin-top: 12px;
        opacity: .8;
      }
      button {
        margin-top: 10px;
        border: 1px solid #3b4252;
        background: #1f2430;
        color: inherit;
        border-radius: 6px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="overlay" id="overlay">
        <img id="panelBg" class="panel-bg" alt="panel background" />
        <img id="red" class="light" alt="red light" />
        <img id="yellow" class="light" alt="yellow light" />
        <img id="green" class="light" alt="green light" />
      </div>
      <div class="info">
        <div class="state" id="state">IDLE</div>
        <div>Reason: <span id="reason">No event</span></div>
        <div>Source: <span id="source">bridge/mock</span></div>
        <button id="nextBtn">Next Mock State</button>
        <div class="hint">This web shell is the UI base for Tauri packaging.</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
