<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Traffic Lights</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      .overlay {
        position: relative;
        width: 60.48px;
        height: 161.46px;
        cursor: move;
        -webkit-app-region: drag;
      }
      .panel-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .light-wrap {
        position: absolute;
        width: 48.6px;
        height: 48.6px;
        left: 5.94px;
        pointer-events: none;
      }
      .light {
        width: 100%;
        height: 100%;
        display: block;
      }
      #redWrap { top: 10.26px; }
      #yellowWrap { top: 56.43px; }
      #greenWrap { top: 102.6px; }
      .badge {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
        pointer-events: none;
      }
      .badge.visible { display: flex; }
      .badge-red {
        color: #ffd6d6;
        text-shadow: 0 0 2px rgba(0, 0, 0, 0.85), 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .badge-yellow {
        color: #5c4a00;
        text-shadow: 0 0 2px rgba(255, 255, 255, 0.55);
      }
      .badge-green {
        color: #d7ffd7;
        text-shadow: 0 0 2px rgba(0, 0, 0, 0.85), 0 1px 2px rgba(0, 0, 0, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="overlay" id="overlay">
      <img id="panelBg" class="panel-bg" alt="" />
      <div id="redWrap" class="light-wrap">
        <img id="red" class="light" alt="" />
        <span id="redBadge" class="badge badge-red"></span>
      </div>
      <div id="yellowWrap" class="light-wrap">
        <img id="yellow" class="light" alt="" />
        <span id="yellowBadge" class="badge badge-yellow"></span>
      </div>
      <div id="greenWrap" class="light-wrap">
        <img id="green" class="light" alt="" />
        <span id="greenBadge" class="badge badge-green"></span>
      </div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
